<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CPS Check</title>
  <link rel="stylesheet" href="style.css?v=aa37bcc2" />
</head>
<body>
  <main class="app">
    <h1>CPS Check</h1>
    <p class="subtitle">Teste seus cliques por segundo</p>

    <div class="duration-select" role="group" aria-label="Duração do teste">
      <button class="duration-btn" data-duration="1">1s</button>
      <button class="duration-btn" data-duration="5" data-active="true">5s</button>
      <button class="duration-btn" data-duration="10">10s</button>
      <button class="duration-btn" data-duration="60">60s</button>
      <button class="duration-btn" data-duration="100">100s</button>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-value" id="clicks">0</span>
        <span class="stat-label">Cliques</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="time">5.0</span>
        <span class="stat-label">Tempo</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="cps">0.00</span>
        <span class="stat-label">CPS</span>
      </div>
    </div>

    <button id="clickArea" class="click-area">
      <span id="clickAreaLabel">Clique para começar</span>
    </button>

    <div class="best" id="best" hidden>
      Melhor resultado: <span id="bestValue">0.00</span> CPS
    </div>

    <button id="resetBtn" class="reset-btn" hidden>Tentar novamente</button>
  </main>

  <script src="script.js?v=abf74153"></script>
</body>
</html>
